# ============================================================================
# Palanca Gas Plant — Module 3, Day 4: Firewall Configuration
# Extends the Module 2 Lab Environment (docker-compose.yml) with the two
# segments the Day 4 lab pack calls for (Management/VLAN 40, Quarantine/
# VLAN 99), an Enterprise zone (needed to test R08-R12, which the CSV
# writes against an Enterprise zone that Module 2's topology never
# modeled), and a real firewall enforcement point (fw-ot-01) implementing
# the full Palanca FW-OT-01 ruleset from ../firewall-rules-module3.csv.
#
# Two changes from Module 2's topology, both required for the firewall to
# mean anything rather than being bypassed:
#
#  1. scada-hmi-01/02 and eng-ws-01 are no longer dual-homed onto
#     ot_control. In Module 2 that dual-homing WAS the "flat network"
#     finding trainees were meant to discover in Day 5. Day 4 here is
#     framed as remediating that finding: Supervisory now reaches Control
#     only through fw-ot-01, so R01-R04 are real, enforced, testable
#     rules instead of traffic that never touches a firewall at all.
#     sw-core-01 keeps its two interfaces (control+supervisory) — a core
#     switch legitimately terminates both VLANs, and unlike the HMI/ENG-WS
#     containers it never does IP forwarding between them, so it isn't a
#     bypass path.
#
#  2. fw-ot-01 is the only container with interfaces on all six networks.
#     Docker does not route between separate bridge networks on its own
#     (that's exactly why Module 2 relied on multi-homed containers to
#     bridge zones) — so fw-ot-01 does real Linux IP forwarding between
#     its interfaces, and every other container gets a route pointing
#     cross-zone traffic at fw-ot-01's address on its own subnet (applied
#     by setup.sh after 'up -d', since compose has no field for a custom
#     per-container gateway). That FORWARD path inside fw-ot-01 is where
#     firewall/apply_rules.sh enforces R01-R12 + R99.
name: palanca-lab-m3-fw

networks:
  ot_control:       # Purdue Level 1 — PLCs, RTUs, relays, VFD, core switch
    driver: bridge
    ipam:
      config: [{subnet: 192.168.1.0/24, gateway: 192.168.1.254}]
  ot_supervisory:    # Purdue Level 2 — HMIs, engineering workstation
    driver: bridge
    ipam:
      config: [{subnet: 192.168.2.0/24, gateway: 192.168.2.254}]
  ot_dmz:            # Purdue Level 3 — historian / DMZ
    driver: bridge
    ipam:
      config: [{subnet: 192.168.3.0/24, gateway: 192.168.3.254}]
  ot_management:     # VLAN 40 — switch/firewall management plane (new, Day 4)
    driver: bridge
    ipam:
      config: [{subnet: 192.168.40.0/24, gateway: 192.168.40.254}]
  ot_quarantine:     # VLAN 99 — new/untrusted devices pending verification (new, Day 4)
    driver: bridge
    ipam:
      config: [{subnet: 192.168.99.0/24, gateway: 192.168.99.254}]
  ot_enterprise:     # Corporate/Enterprise zone — R08-R12 all name this zone,
    driver: bridge    # but Module 2 never modeled it; added so those 5 of 11
    ipam:             # rules are actually reachable and testable (new, Day 4)
      config: [{subnet: 192.168.50.0/24, gateway: 192.168.50.254}]

services:

  # ── Firewall enforcement point ────────────────────────────────────────
  fw-ot-01:
    build: {context: ./firewall, dockerfile: Dockerfile.firewall}
    container_name: fw-ot-01
    hostname: fw-ot-01
    cap_add: [NET_ADMIN, NET_RAW]
    # Set at the Docker level rather than left to apply_rules.sh writing
    # /proc/sys itself — some Docker configs mount /proc/sys read-only
    # inside the container, which fails a runtime 'echo 1 > .../ip_forward'
    # even with NET_ADMIN. sysctls: is applied by the daemon before that
    # restriction applies.
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      ot_control:      {ipv4_address: 192.168.1.5}
      ot_supervisory:  {ipv4_address: 192.168.2.5}
      ot_dmz:          {ipv4_address: 192.168.3.5}
      ot_management:   {ipv4_address: 192.168.40.5}
      ot_quarantine:   {ipv4_address: 192.168.99.5}
      ot_enterprise:   {ipv4_address: 192.168.50.5}
    restart: unless-stopped

  # ── Control zone (Purdue Level 1) ─────────────────────────────────────
  plc-main-01:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: plc-main-01
    hostname: plc-main-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: PLC-MAIN-01
      DEVICE_VENDOR: "Siemens S7-1200"
      NUM_REGISTERS: "50"
      EXTRA_PORTS: "4840"   # stub OPC-UA port so R02 (Supervisory->Control) is testable
    networks:
      ot_control: {ipv4_address: 192.168.1.10}
    restart: unless-stopped

  plc-aux-01:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: plc-aux-01
    hostname: plc-aux-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: PLC-AUX-01
      DEVICE_VENDOR: "Siemens S7-1200"
      NUM_REGISTERS: "50"
    networks:
      ot_control: {ipv4_address: 192.168.1.11}
    restart: unless-stopped

  gen1-rtu:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: gen1-rtu
    hostname: gen1-rtu
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: GEN1-RTU
      DEVICE_VENDOR: "GE Automation"
      NUM_REGISTERS: "30"
    networks:
      ot_control: {ipv4_address: 192.168.1.20}
    restart: unless-stopped

  gen2-rtu:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: gen2-rtu
    hostname: gen2-rtu
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: GEN2-RTU
      DEVICE_VENDOR: "GE Automation"
      NUM_REGISTERS: "30"
    networks:
      ot_control: {ipv4_address: 192.168.1.21}
    restart: unless-stopped

  prot-rel-01:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: prot-rel-01
    hostname: prot-rel-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: PROT-REL-01
      DEVICE_VENDOR: "ABB REL670"
      NUM_REGISTERS: "20"
    networks:
      ot_control: {ipv4_address: 192.168.1.30}
    restart: unless-stopped

  prot-rel-02:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: prot-rel-02
    hostname: prot-rel-02
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: PROT-REL-02
      DEVICE_VENDOR: "ABB REL670"
      NUM_REGISTERS: "20"
    networks:
      ot_control: {ipv4_address: 192.168.1.31}
    restart: unless-stopped

  vfd-pump-01:
    build: {context: ./sims, dockerfile: Dockerfile.modbus}
    container_name: vfd-pump-01
    hostname: vfd-pump-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: VFD-PUMP-01
      DEVICE_VENDOR: "ABB ACS580"
      NUM_REGISTERS: "20"
    networks:
      ot_control: {ipv4_address: 192.168.1.40}
    restart: unless-stopped

  sw-core-01:
    build: {context: ./switch, dockerfile: Dockerfile.switch}
    container_name: sw-core-01
    hostname: sw-core-01
    networks:
      ot_control: {ipv4_address: 192.168.1.1}
      ot_supervisory: {ipv4_address: 192.168.2.1}
    restart: unless-stopped

  traffic-gen:
    build: {context: ./traffic-gen, dockerfile: Dockerfile.traffic}
    container_name: traffic-gen
    networks:
      ot_control: {ipv4_address: 192.168.1.200}
    depends_on: [plc-main-01, plc-aux-01, gen1-rtu, gen2-rtu, prot-rel-01, prot-rel-02, vfd-pump-01]
    restart: unless-stopped

  # ── Supervisory zone (Purdue Level 2) ─────────────────────────────────
  # NOTE: single-homed here (no ot_control leg) — see the topology note at
  # the top of this file. Module 2's asset table showed a second,
  # ot_control-side IP for these hosts; that leg is intentionally removed
  # in this Day 4 copy.
  scada-hmi-01:
    build: {context: ./hmi, dockerfile: Dockerfile.hmi}
    container_name: scada-hmi-01
    hostname: scada-hmi-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: SCADA-HMI-01
      EXTRA_PORTS: "443"   # stub HTTPS port so R06 (DMZ->Supervisory) is testable
    networks:
      ot_supervisory: {ipv4_address: 192.168.2.10}
    restart: unless-stopped

  scada-hmi-02:
    build: {context: ./hmi, dockerfile: Dockerfile.hmi}
    container_name: scada-hmi-02
    hostname: scada-hmi-02
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: SCADA-HMI-02
      EXTRA_PORTS: "443"
    networks:
      ot_supervisory: {ipv4_address: 192.168.2.11}
    restart: unless-stopped

  eng-ws-01:
    build: {context: ./eng-ws, dockerfile: Dockerfile.engws}
    container_name: eng-ws-01
    hostname: eng-ws-01
    cap_add: [NET_RAW, NET_ADMIN]        # required for tshark/tcpdump capture + cross-zone routes
    networks:
      ot_supervisory: {ipv4_address: 192.168.2.20}
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ── DMZ (Purdue Level 3) ───────────────────────────────────────────────
  # NOTE: single-homed on ot_dmz only (Module 2 also gave this container a
  # direct ot_supervisory address, 192.168.2.30). Testing showed that leg
  # bypasses fw-ot-01 the same way the HMI/ENG-WS dual-homing did: any
  # Supervisory host reaching historian's OWN supervisory-side address is
  # same-subnet local delivery, never touching the firewall — R05/R06/R07
  # only become real, enforced rules once that direct leg is removed.
  historian-01:
    build: {context: ./historian, dockerfile: Dockerfile.historian}
    container_name: historian-01
    hostname: historian-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: HISTORIAN-01
      EXTRA_PORTS: "4840,443"   # R05 (Supervisory->DMZ OPC-UA), R09/R10 (Enterprise->DMZ HTTPS)
    networks:
      ot_dmz: {ipv4_address: 192.168.3.10}
    restart: unless-stopped

  # ── New Day 4 segments ──────────────────────────────────────────────────
  # Per the lab pack: no device simulators are needed for these zones —
  # each still gets one lightweight endpoint container so an attempted
  # connection actually reaches (and is stopped by) the firewall instead
  # of failing locally with "no route", which would look like a pass for
  # the wrong reason.
  mgmt-ws-01:
    build: {context: ./endpoint, dockerfile: Dockerfile.endpoint}
    container_name: mgmt-ws-01
    hostname: mgmt-ws-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: MGMT-WS-01
      PORTS: "8080"
    networks:
      ot_management: {ipv4_address: 192.168.40.10}
    restart: unless-stopped

  quarantine-host-01:
    build: {context: ./endpoint, dockerfile: Dockerfile.endpoint}
    container_name: quarantine-host-01
    hostname: quarantine-host-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: QUARANTINE-HOST-01
      PORTS: "8080"
    networks:
      ot_quarantine: {ipv4_address: 192.168.99.10}
    restart: unless-stopped

  enterprise-ws-01:
    build: {context: ./endpoint, dockerfile: Dockerfile.endpoint}
    container_name: enterprise-ws-01
    hostname: enterprise-ws-01
    cap_add: [NET_ADMIN]
    environment:
      DEVICE_NAME: ENTERPRISE-WS-01
      PORTS: "1433"   # R08: DMZ->Enterprise SQL
    networks:
      ot_enterprise: {ipv4_address: 192.168.50.10}
    restart: unless-stopped
